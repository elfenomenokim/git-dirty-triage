name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest (26.04) ships no 3.9 build; keep 3.9 on ubuntu-22.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
        # ubuntu-latest (26.04) ships no 3.9 build; keep the 3.9 floor on ubuntu-22.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Compile and fixture smoke check
        shell: bash
        run: |
          # No separate unit-test suite exists; run the documented compile and demo-fixture smoke check.
          python -m compileall -q src
          fixture="$(mktemp -d "${RUNNER_TEMP:-/tmp}/triage-check.XXXXXX")"
          trap 'rm -rf "$fixture"' EXIT
          bash docs/demo/make-repo.sh "$fixture/repo"
          git-dirty-triage --repo "$fixture/repo/shared"
